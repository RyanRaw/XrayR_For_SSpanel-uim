<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="XrayR — SSPanel-UIM 适配版 文档">
<title>XrayR — SSPanel-UIM 适配版 文档</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
<style>
  :root { --theme-color: #58a6ff; }
  body, .sidebar, .sidebar-toggle { background: #0d1117; }
  .sidebar { border-right: 1px solid #21262d; }
  .sidebar ul li a { color: #8b949e; }
  /* 侧边栏复用 SUMMARY.md，隐藏它开头的 “# Table of contents” */
  .sidebar-nav > h1:first-child { display: none; }
  .sidebar ul li.active > a, .sidebar ul li a:hover { color: #58a6ff; }
  .app-name-link { color: #f0f6fc !important; }
  .content { color: #c9d1d9; }
  .markdown-section { max-width: 900px; }
  .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 { color: #f0f6fc; border-bottom-color: #21262d; }
  .markdown-section a { color: #58a6ff; }
  .markdown-section code { background: #161b22; color: #e6edf3; }
  .markdown-section pre { background: #161b22; }
  .markdown-section pre > code { background: none; }
  .markdown-section blockquote { border-left: 4px solid #30363d; background: #161b22; color: #8b949e; }
  .markdown-section table tr { border-color: #21262d; }
  .markdown-section table tr:nth-child(2n) { background: #161b22; }
  .markdown-section hr { border-bottom-color: #21262d; }
  .search input { background: #161b22; border-color: #30363d; color: #c9d1d9; }
  .search .results-panel { background: #161b22; border-color: #30363d; }
  .search .matching-post { border-bottom-color: #21262d; }
</style>
</head>
<body>

<div id="app">加载中…</div>

<script>
  window.$docsify = {
    name: 'XrayR — SSPanel-UIM 适配版',
    repo: 'RyanRaw/XrayR_For_SSpanel-uim',
    homepage: 'README.md',
    // 侧边栏直接复用 GitBook 时代的 SUMMARY.md，避免两份目录
    loadSidebar: 'SUMMARY.md',
    subMaxLevel: 3,
    maxLevel: 4,
    auto2top: true,
    // 文档里的链接是相对路径（如 ../../xrayr-pei-zhi-wen-jian-shuo-ming/config.md）
    relativePath: true,
    search: {
      placeholder: '搜索文档',
      noData: '没有找到结果',
      depth: 3
    },
    copyCode: {
      buttonText: '复制',
      errorText: '复制失败',
      successText: '已复制'
    }
  }

  // 把历史文档里的 GitBook hint 语法转成引用块，否则会原样显示 {% hint %} 文本
  window.$docsify.plugins = [function (hook) {
    hook.beforeEach(function (content) {
      return content.replace(
        /\{%\s*hint[^%]*%\}([\s\S]*?)\{%\s*endhint\s*%\}/g,
        function (_, body) {
          return body.trim().split('\n').map(function (line) {
            return line ? '> ' + line : '>';
          }).join('\n');
        }
      )
    })
  }]
</script>

<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>

</body>
</html>
